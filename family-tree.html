<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Velhari Sankaran - Ancestry</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dtree@3.1.1/dtree.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: "#0f172a",
                        "surface-container": "#1e293b",
                        outline: "#475569",
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; overflow: hidden; }
        
        /* dTree styling */
        .linage { fill: none; stroke: #3b82f6; stroke-width: 2px; }
        .marriage { fill: none; stroke: #94a3b8; stroke-width: 2px; stroke-dasharray: 4; }
        
        .node { background-color: #1e293b; border: 1px solid #3b82f6; border-radius: 8px; }
        .nodeText { font-family: 'Inter', sans-serif; fill: #f8fafc; font-size: 14px; font-weight: 600; pointer-events: none; }
        .surnameText { font-family: 'Inter', sans-serif; fill: #94a3b8; font-size: 10px; pointer-events: none; }
        
        .node.female { border-color: #ec4899; } /* Pink for female */
        .node.male { border-color: #3b82f6; }   /* Blue for male */

        svg { width: 100vw; height: 100vh; cursor: grab; }
        svg:active { cursor: grabbing; }
    </style>
</head>
<body>
    <div class="fixed top-0 left-0 w-full p-4 flex justify-between items-center z-10 pointer-events-none">
        <div>
            <h1 class="text-2xl font-bold text-white tracking-wide">ANCESTRY</h1>
            <p class="text-sm text-slate-400">Interactive Family Tree</p>
        </div>
        <a href="index.html" class="pointer-events-auto px-4 py-2 bg-surface-container border border-outline rounded-lg text-sm hover:bg-slate-700 transition-colors shadow-lg">Return to Main</a>
    </div>

    <div id="tree-container" class="w-full h-screen"></div>

    <script>
        d3.json("data/family_dtree.json").then(function(data) {
            dTree.init(data, {
                target: "#tree-container",
                debug: false,
                height: window.innerHeight,
                width: window.innerWidth,
                callbacks: {
                    nodeRenderer: function(name, x, y, height, width, extra, id, nodeClass, textClass, textRenderer) {
                        const surname = extra && extra.surname ? extra.surname : '';
                        let nodeHtml = `<div class="node ${nodeClass}" style="width:${width}px; height:${height}px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding: 4px; box-sizing: border-box; background-color: #1e293b;">`;
                        nodeHtml += `<div style="color: #f8fafc; font-size: 13px; font-weight: 600; word-wrap: break-word;">${name}</div>`;
                        if (surname) {
                            nodeHtml += `<div style="color: #94a3b8; font-size: 10px; word-wrap: break-word;">${surname}</div>`;
                        }
                        nodeHtml += `</div>`;
                        return nodeHtml;
                    }
                },
                margin: { top: 80, right: 0, bottom: 0, left: 0 },
                nodeWidth: 140,
                nodeHeight: 60,
                styles: {
                    node: 'node',
                    linage: 'linage',
                    marriage: 'marriage',
                    text: 'nodeText'
                }
            });
            
            // Adjust SVG to allow zooming/panning correctly
            setTimeout(() => {
                const svg = d3.select("#tree-container svg");
                const g = svg.select("g");
                const zoom = d3.zoom().on("zoom", () => {
                    g.attr("transform", d3.event.transform);
                });
                svg.call(zoom);
                
                // Initial translation to center it roughly
                svg.call(zoom.transform, d3.zoomIdentity.translate(window.innerWidth / 3, 50).scale(0.8));
            }, 100);
        });
    </script>
</body>
</html>
