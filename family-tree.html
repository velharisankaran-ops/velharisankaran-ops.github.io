<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Velhari Sankaran - Ancestry</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: "#0f172a",
                        "surface-container": "#1e293b",
                        outline: "#475569",
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; overflow: hidden; }
        .node circle { fill: #1e293b; stroke: #3b82f6; stroke-width: 2px; }
        .node text { font-family: 'Inter', sans-serif; fill: #e2e8f0; font-size: 14px; pointer-events: none; }
        .node .surname { fill: #94a3b8; font-size: 11px; }
        .link { fill: none; stroke: #334155; stroke-width: 1.5px; }
        svg { width: 100vw; height: 100vh; cursor: grab; }
        svg:active { cursor: grabbing; }
    </style>
</head>
<body>
    <div class="fixed top-0 left-0 w-full p-4 flex justify-between items-center z-10 pointer-events-none">
        <div>
            <h1 class="text-2xl font-bold text-white tracking-wide">ANCESTRY</h1>
            <p class="text-sm text-slate-400">Interactive Family Tree</p>
        </div>
        <a href="index.html" class="pointer-events-auto px-4 py-2 bg-surface-container border border-outline rounded-lg text-sm hover:bg-slate-700 transition-colors shadow-lg">Return to Main</a>
    </div>

    <div id="tree-container"></div>

    <script>
        const width = window.innerWidth;
        const height = window.innerHeight;
        
        const svg = d3.select("#tree-container").append("svg")
            .attr("viewBox", [0, 0, width, height]);
            
        const g = svg.append("g");
        
        const zoom = d3.zoom().on("zoom", (e) => {
            g.attr("transform", e.transform);
        });
        
        svg.call(zoom);
        
        d3.json("data/family.json").then(data => {
            const root = d3.hierarchy(data);
            
            // Adjust tree size based on depth
            const dx = 50;
            const dy = 300; 
            const tree = d3.tree().nodeSize([dx, dy]);
            
            tree(root);
            
            // Center the tree horizontally and vertically
            let x0 = Infinity, x1 = -x0;
            root.each(d => {
                if (d.x > x1) x1 = d.x;
                if (d.x < x0) x0 = d.x;
            });
            
            svg.call(zoom.transform, d3.zoomIdentity.translate(width / 4, height / 2).scale(0.8));

            const link = g.append("g")
                .attr("class", "links")
                .selectAll("path")
                .data(root.links())
                .join("path")
                .attr("class", "link")
                .attr("d", d3.linkHorizontal()
                    .x(d => d.y)
                    .y(d => d.x));
                    
            const node = g.append("g")
                .attr("class", "nodes")
                .selectAll("g")
                .data(root.descendants())
                .join("g")
                .attr("class", "node")
                .attr("transform", d => `translate(${d.y},${d.x})`);

            node.append("circle")
                .attr("r", 6);

            node.append("text")
                .attr("dy", "-0.5em")
                .attr("x", d => d.children ? -12 : 12)
                .style("text-anchor", d => d.children ? "end" : "start")
                .text(d => d.data.name)
                .attr("font-weight", "600");
                
            node.append("text")
                .attr("dy", "0.8em")
                .attr("x", d => d.children ? -12 : 12)
                .attr("class", "surname")
                .style("text-anchor", d => d.children ? "end" : "start")
                .text(d => d.data.surname || '');
                
        }).catch(err => {
            console.error("Error loading family data:", err);
            d3.select("#tree-container").html("<div class='p-8 text-red-400'>Error loading family data. Ensure data/family.json exists.</div>");
        });
    </script>
</body>
</html>
